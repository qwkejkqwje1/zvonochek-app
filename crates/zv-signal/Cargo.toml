[package]
name = "zv-signal"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
mock = []

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
bytes = "1.12.1"
futures-util = "0.3.34"
hex = "0.4.3"
k256 = { version = "0.14.0", features = ["schnorr"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "json", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots", "url"] }
tracing = "0.1.44"
url = "2.5.8"
webpki-roots = "1.0.11"
zv-proto = { version = "4.0.0-beta.1", path = "../zv-proto" }
