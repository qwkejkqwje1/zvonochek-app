[package]
name = "zv-p2p"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
curve25519-dalek = "5"
bytes = "1"
hex = "0.4.3"
futures = "0.3"
hickory-resolver = { version = "0.26", default-features = false }
hkdf = "0.13.0"
hmac = "0.13.0"
libp2p = { version = "0.57.1", default-features = false, features = ["tokio", "tcp", "quic", "dns", "noise", "yamux", "identify", "ping", "kad", "relay", "dcutr", "autonat", "upnp", "mdns", "macros", "ed25519", "rsa"] }
libp2p-stream = "0.5.0-alpha"
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring", "portmapper"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.54.1", features = ["full", "test-util"] }
