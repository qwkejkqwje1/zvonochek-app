[package]
name = "zv-p2p"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
curve25519-dalek = "5"
bytes = "1"
hex = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring", "portmapper"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full", "test-util"] }
