[package]
name = "zv-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
hex = "0.4.3"
base64 = "0.23.1"
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "json", "rustls-no-provider"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
url = "2.5.8"
zv-proto = { path = "../zv-proto" }
zv-signal = { path = "../zv-signal" }
zv-p2p = { path = "../zv-p2p" }
rusqlite = { version = "0.41.1", features = ["bundled"] }
blake3 = "1.8.7"
futures-util = "0.3.34"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots", "url"] }
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
ed25519-dalek = "3.0.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory"] }

[dev-dependencies]
tempfile = "3"
zv-signal = { path = "../zv-signal", features = ["mock"] }
