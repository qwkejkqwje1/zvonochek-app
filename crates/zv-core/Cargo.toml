[package]
name = "zv-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
hex = "0.4.3"
base64 = "0.23.1"
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "json", "rustls-no-provider"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
url = "2.5.8"
zv-proto = { path = "../zv-proto" }
zv-signal = { path = "../zv-signal" }
zv-p2p = { path = "../zv-p2p" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory"] }

[dev-dependencies]
tempfile = "3"
zv-signal = { path = "../zv-signal" }
