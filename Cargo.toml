[workspace]
resolver = "3"
members = ["crates/*", "app"]

[workspace.package]
version = "4.1.0"
edition = "2024"
publish = false

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1

[profile.release]
codegen-units = 4
lto = "thin"
strip = true
panic = "abort"
