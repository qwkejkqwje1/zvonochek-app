[package]
name = "zvonochek"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "ZVONochek — звонки и чаты (ПК и Android)"
default-run = "zvonochek"

# Android собирает библиотеку (cdylib) и запускает её из MainActivity; ПК — бинарник zvonochek поверх неё.
[lib]
name = "zvonochek_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5.7"
zv-core = { path = "../crates/zv-core" }
zv-proto = { path = "../crates/zv-proto" }
zv-signal = { path = "../crates/zv-signal" }

# Android: вызовы из Kotlin в ядро (та же версия, что у tao/wry)
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

# только ПК: трей и автозапуск, один экземпляр, автообновление, размер окна
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
