name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Ядро — тесты, clippy, fmt (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p zv-proto -p zv-signal -p zv-core -p zv-cli -p zv-devhost --all-targets -- -D warnings
      - run: cargo test -p zv-proto -p zv-signal -p zv-core

  windows:
    name: Приложение — сборка (${{ matrix.target }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo clippy -p zvonochek --target ${{ matrix.target }} -- -D warnings
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install -g @tauri-apps/cli@2.12.4
      # Тестовый установщик NSIS для ручной проверки. Без файлов автообновления:
      # ключ подписи обновлений нужен только релизу (release.yml).
      - name: Установщик NSIS (тестовый)
        working-directory: app
        shell: bash
        run: |
          tauri build --target ${{ matrix.target }} --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - uses: actions/upload-artifact@v4
        with:
          name: zvonochek-setup-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
      # Переносная версия: тот же exe без установщика — данные в папке ZVONochek-data рядом с ним
      - name: Переносной exe
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/zvonochek.exe" dist/ZVONochek.exe
      - uses: actions/upload-artifact@v4
        with:
          name: zvonochek-portable-${{ matrix.target }}
          path: dist/ZVONochek.exe
          if-no-files-found: error
          retention-days: 14
