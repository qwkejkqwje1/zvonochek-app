name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go vet ./...
      - run: go test -count=1 ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Version
        run: |
          V="${GITHUB_REF_NAME#v}"
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "WINVER=${V%%-*}.0" >> "$GITHUB_ENV"

      - name: Windows resources (icon, manifest, version info)
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3
          cd cmd/zvonochek
          "$(go env GOPATH)/bin/go-winres" make --in winres/winres.json --out rsrc --arch amd64,arm64 \
            --product-version "$WINVER" --file-version "$WINVER"

      - name: Build
        run: COMMIT="${GITHUB_SHA::7}" SKIP_TESTS=1 ./build.sh

      - name: Release notes
        run: |
          awk -v v="$VERSION" '/^## \[/ { p = index($0, "[" v "]") > 0; next } p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Звоночек $VERSION" > notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$VERSION" in *-*) flags="--prerelease" ;; esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* $flags --verify-tag \
              --title "Звоночек $VERSION" --notes-file notes.md
          fi
