name: Release

# Тег vX.Y.Z → черновик релиза: Windows x64/ARM64 — переносной exe (ZVONochek_<версия>_x64.exe / _arm64.exe) и
# latest.json для самообновления (подпись Ed25519 каждого exe, .github/scripts/sign-release.mjs), APK для Android.
# Опубликуйте черновик вручную — с этого момента приложения увидят новую версию (releases/latest/download/latest.json).
# Секреты: ZV_UPDATE_KEY — закрытый ключ подписи обновлений (PEM, Ed25519; открытый — KEYS_HEX в
# crates/zv-core/src/update.rs); для APK — ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS.
# Файлы для скачивания можно класть в отдельный открытый репозиторий (если этот закрыт): переменная
# ZV_RELEASE_REPO (владелец/имя) и секрет ZV_RELEASE_TOKEN с правом записи в него.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install -g @tauri-apps/cli@2.12.4
      - name: Сборка exe
        working-directory: app
        shell: bash
        run: tauri build --target ${{ matrix.target }} --no-bundle
      - name: exe
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/zvonochek.exe" "dist/ZVONochek_${{ matrix.arch }}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: release-exe-${{ matrix.arch }}
          path: dist/ZVONochek_${{ matrix.arch }}.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Черновик релиза
    needs: build
    runs-on: ubuntu-latest
    env:
      ZV_RELEASE_REPO: ${{ vars.ZV_RELEASE_REPO || github.repository }}
    outputs:
      tag: ${{ steps.rel.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: release-exe-*
          path: dist
          merge-multiple: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Подпись и latest.json
        env:
          ZV_UPDATE_KEY: ${{ secrets.ZV_UPDATE_KEY }}
        run: node .github/scripts/sign-release.mjs dist "$GITHUB_REF_NAME"
      - name: Черновик релиза
        id: rel
        env:
          GH_TOKEN: ${{ vars.ZV_RELEASE_REPO && secrets.ZV_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./app/tauri.conf.json').version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if ! gh release view "$TAG" -R "$ZV_RELEASE_REPO" > /dev/null 2>&1; then
            gh release create "$TAG" -R "$ZV_RELEASE_REPO" --draft --title "ZVONochek $TAG" --notes-file dist/notes.md
          fi
          gh release upload "$TAG" -R "$ZV_RELEASE_REPO" dist/out/* --clobber
          echo "Черновик $TAG в $ZV_RELEASE_REPO: $(ls dist/out | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"

  android:
    name: Android
    needs: publish
    uses: ./.github/workflows/android.yml
    with:
      release_tag: ${{ needs.publish.outputs.tag }}
    secrets: inherit
